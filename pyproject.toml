[project]
name = "forge"
version = "1.0.0"
description = "Reaction-guided generative design of ionizable lipids"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.13.0", "rdkit==2026.3.5", "numpy==2.4.6", "pandas==3.0.5",
  "scikit-learn==1.9.0", "scipy==1.17.1", "PyYAML==6.0.3", "threadpoolctl>=3.1",
]

[project.scripts]
forge = "forge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12", "black>=25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["artifacts: requires the separately fetched paper artifacts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.black]
line-length = 100
target-version = ["py311"]
